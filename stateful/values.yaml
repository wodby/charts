# Default values for stateful.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
revisionHistoryLimit: 10
podManagementPolicy: OrderedReady

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

image:
  registry: docker.io
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "latest"
  digest: ""
  pullSecrets: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
containerName: ""

commonLabels: {}
commonAnnotations: {}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

containerPorts:
  - name: http
    containerPort: 80
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  clusterIP: ""
  loadBalancerIP: ""
  externalTrafficPolicy: ""
  # Defaults to one port per containerPorts entry. Each port takes name, port, targetPort, protocol, nodePort and
  # appProtocol; kubernetes.io/h2c makes gateways such as Envoy Gateway use cleartext HTTP/2 to reach it (gRPC).
  ports: []

# More Services for the same pods, each named <fullname>-<name>, for example to give some ports a different
# appProtocol or to route them separately. Each takes name, type, annotations and ports (as service.ports).
extraServices: []

headlessService:
  enabled: true
  name: ""
  annotations: {}
  publishNotReadyAddresses: true
  ports: []

persistence:
  enabled: false
  existingClaim: ""
  mountPath: /data
  subPath: ""
  storageClass: ""
  labels: {}
  annotations: {}
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  selector: {}

resources: {}

envVars: []
envFrom: []
command: []
args: []

startupProbe: {}
livenessProbe: {}
readinessProbe: {}
lifecycle: {}

updateStrategy:
  type: RollingUpdate

initContainers: []
extraContainers: []
# More containers in the pod, keyed by container name. Each takes the main container's keys, so every value has a
# fixed path such as additionalContainers.<name>.image.tag, unlike the free-form extraContainers. A container is added
# only when its image.repository is set. securityContext defaults to the main container's; image.pullPolicy defaults
# to image.pullPolicy. The data volume can be mounted with extraVolumeMounts.
#
# additionalContainers:
#   runner:
#     image:
#       registry: docker.io
#       repository: example/runner
#       tag: "1.0.0"
#       digest: ""
#       pullPolicy: ""
#     command: []
#     args: []
#     envVars: []
#     envFrom: []
#     containerPorts: []
#     securityContext: {}
#     resources: {}
#     startupProbe: {}
#     livenessProbe: {}
#     readinessProbe: {}
#     lifecycle: {}
#     extraVolumeMounts: []
additionalContainers: {}

extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 30

# Minimum time a ready pod must remain healthy before an update continues.
minReadySeconds: 10
