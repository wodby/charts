apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "supabase.fullname" . }}-gateway
  labels: {{- include "supabase.labels" . | nindent 4 }}
data:
  envoy.yaml: {{ .Files.Get "files/envoy.yaml" | quote }}
  cds.yaml: {{ tpl (.Files.Get "files/cds.yaml") . | quote }}
  lds.template.yaml: {{ .Files.Get "files/lds.template.yaml" | quote }}
  gateway.cjs: {{ .Files.Get "files/gateway.cjs" | quote }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supabase.serviceAccount" . }}
  labels: {{- include "supabase.labels" . | nindent 4 }}
  annotations: {{ toYaml .Values.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- range $key := list "storage" "studio" }}
{{- $p := (index $.Values $key).persistence }}
{{- if and $p.enabled (not $p.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "supabase.fullname" $ }}-{{ $key }}
  labels:
    {{- include "supabase.labels" $ | nindent 4 }}
    {{- with $p.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $p.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
{{- end }}
