resources:
- '@type': type.googleapis.com/envoy.config.listener.v3.Listener
  name: supabase
  per_connection_buffer_limit_bytes: 32768
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 8000
  filter_chains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        stat_prefix: ingress_http
        normalize_path: true
        merge_slashes: true
        path_with_escaped_slashes_action: REJECT_REQUEST
        use_remote_address: true
        common_http_protocol_options:
          headers_with_underscores_action: REJECT_REQUEST
        upgrade_configs:
        - upgrade_type: websocket
        access_log:
        - name: envoy.access_loggers.stdout
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
            log_format:
              text_format_source:
                inline_string: '%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% - - [%START_TIME(%d/%b/%Y:%H:%M:%S %z)%] "%REQ(:METHOD)%
                  %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%" %RESPONSE_CODE% %BYTES_SENT% "%REQ(REFERER)%" "%REQ(USER-AGENT)%"

                  '
        route_config:
          name: supabase_route
          virtual_hosts:
          - name: supabase_host
            domains:
            - '*'
            cors:
              allow_origin_string_match:
              - safe_regex:
                  regex: .*
              allow_methods: GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD,CONNECT,TRACE
              allow_headers: '*'
              expose_headers: '*'
              max_age: '3600'
            request_headers_to_add:
            - header:
                key: X-Forwarded-Host
                value: '%REQ(:AUTHORITY)%'
              append_action: ADD_IF_ABSENT
            - header:
                key: X-Forwarded-Port
                value: '%DOWNSTREAM_LOCAL_PORT%'
              append_action: ADD_IF_ABSENT
            routes:
            - match:
                prefix: /auth/v1/verify
              route:
                cluster: auth
                prefix_rewrite: /verify
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /auth/v1/verify
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - match:
                prefix: /auth/v1/callback
              route:
                cluster: auth
                prefix_rewrite: /callback
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /auth/v1/callback
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - match:
                prefix: /auth/v1/authorize
              route:
                cluster: auth
                prefix_rewrite: /authorize
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /auth/v1/authorize
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - match:
                prefix: /auth/v1/.well-known/jwks.json
              route:
                cluster: auth
                prefix_rewrite: /.well-known/jwks.json
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /auth/v1/.well-known/jwks.json
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - match:
                prefix: /.well-known/oauth-authorization-server
              route:
                cluster: auth
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /.well-known/oauth-authorization-server
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - match:
                prefix: /auth/v1/sso/saml/acs
              route:
                cluster: auth
                prefix_rewrite: /sso/saml/acs
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /auth/v1/sso/saml/acs
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - match:
                prefix: /auth/v1/sso/saml/metadata
              route:
                cluster: auth
                prefix_rewrite: /sso/saml/metadata
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /auth/v1/sso/saml/metadata
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - name: functions-v1-all
              match:
                prefix: /functions/v1/
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
              direct_response:
                status: 404
            - match:
                prefix: /storage/v1/
              route:
                cluster: storage
                prefix_rewrite: /
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /storage/v1
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - name: auth-v1-protected
              match:
                prefix: /auth/v1/
              route:
                cluster: auth
                prefix_rewrite: /
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /auth/v1/
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
            - name: rest-v1-openapi-protected
              match:
                path: /rest/v1/
              route:
                cluster: rest
                prefix_rewrite: /
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /rest/v1/
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        admin:
                          permissions:
                          - any: true
                          principals:
                          - header:
                              name: apikey
                              string_match:
                                exact: ${SERVICE_ROLE_KEY}
                          - header:
                              name: apikey
                              string_match:
                                exact: ${SERVICE_ROLE_KEY_ASYMMETRIC}
            - name: rest-v1-protected
              match:
                prefix: /rest/v1/
              route:
                cluster: rest
                prefix_rewrite: /
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /rest/v1/
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
            - name: graphql-v1-protected
              match:
                prefix: /graphql/v1
              route:
                cluster: rest
                prefix_rewrite: /rpc/graphql
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /graphql/v1
                append_action: ADD_IF_ABSENT
              - header:
                  key: Content-Profile
                  value: graphql_public
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
            - name: realtime-v1-api-openapi-blocked
              match:
                prefix: /realtime/v1/api/openapi
              route:
                cluster: realtime
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /realtime/v1/api/openapi
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: DENY
                      policies:
                        deny_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - name: realtime-v1-api-tenants-blocked
              match:
                prefix: /realtime/v1/api/tenants
              route:
                cluster: realtime
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /realtime/v1/api/tenants
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: DENY
                      policies:
                        deny_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
            - name: realtime-v1-api-protected
              match:
                prefix: /realtime/v1/api
              route:
                cluster: realtime
                prefix_rewrite: /api
                timeout: 30s
                host_rewrite_literal: realtime-dev.supabase-realtime
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /realtime/v1/api
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
            - name: realtime-v1-ws-protected
              match:
                prefix: /realtime/v1/
              route:
                cluster: realtime
                prefix_rewrite: /socket/
                timeout: 30s
                host_rewrite_literal: realtime-dev.supabase-realtime
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /realtime/v1/
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
            - name: pg-protected
              match:
                prefix: /pg/
              route:
                cluster: meta
                prefix_rewrite: /
                timeout: 30s
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /pg/
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.cors:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                  - exact: ${SUPABASE_PUBLIC_URL}
                  - safe_regex:
                      regex: https?://(localhost|127\.0\.0\.1)(:[0-9]+)?
                  allow_methods: GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
                  allow_headers: '*'
                  expose_headers: '*'
                  max_age: '3600'
            - match:
                prefix: /api/mcp
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: DENY
                      policies:
                        deny_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
              direct_response:
                status: 404
            - match:
                prefix: /mcp
              typed_per_filter_config:
                envoy.filters.http.basic_auth:
                  '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                  disabled: true
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: DENY
                      policies:
                        deny_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
              direct_response:
                status: 404
            - match:
                prefix: /
              route:
                cluster: studio
                timeout: 30s
              request_headers_to_remove:
              - authorization
              request_headers_to_add:
              - header:
                  key: X-Forwarded-Prefix
                  value: /
                append_action: ADD_IF_ABSENT
              typed_per_filter_config:
                envoy.filters.http.rbac:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        allow_all:
                          permissions:
                          - any: true
                          principals:
                          - any: true
        http_filters:
        - name: envoy.filters.http.cors
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
        - name: envoy.filters.http.basic_auth
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
            users:
              inline_string: ${DASHBOARD_BASIC_AUTH}
        - name: envoy.filters.http.lua
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: "local FUNCTIONS_ROUTE = \"functions-v1-all\"\nlocal FUNCTIONS_PREFIX = \"/functions/v1/\"\n\nlocal\
              \ function is_functions_request(request_handle, headers)\n  if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE\
              \ then\n    return true\n  end\n\n  local path = headers:get(\":path\")\n  if path == nil then\n    return false\n\
              \  end\n\n  return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX\nend\n\nfunction envoy_on_request(request_handle)\n\
              \  local headers = request_handle:headers()\n  if is_functions_request(request_handle, headers) then\n    return\n\
              \  end\n\n  if headers:get(\"apikey\") ~= nil then\n    return\n  end\n\n  local path = headers:get(\":path\"\
              )\n  local query_start = string.find(path, \"?\", 1, true)\n  if query_start == nil then\n    return\n  end\n\
              \n  local query = string.sub(path, query_start + 1)\n  for key, value in string.gmatch(query, \"([^&]+)=([^&]*)\"\
              ) do\n    if key == \"apikey\" and value ~= \"\" then\n      headers:add(\"apikey\", value)\n      return\n\
              \    end\n  end\nend\n"
        - name: envoy.filters.http.lua
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: "local ANON_KEY = \"${ANON_KEY}\"\nlocal SERVICE_ROLE_KEY = \"${SERVICE_ROLE_KEY}\"\nlocal SUPABASE_PUBLISHABLE_KEY\
              \ = \"${SUPABASE_PUBLISHABLE_KEY}\"\nlocal SUPABASE_SECRET_KEY = \"${SUPABASE_SECRET_KEY}\"\nlocal ANON_KEY_ASYMMETRIC\
              \ = \"${ANON_KEY_ASYMMETRIC}\"\nlocal SERVICE_ROLE_KEY_ASYMMETRIC = \"${SERVICE_ROLE_KEY_ASYMMETRIC}\"\nlocal\
              \ TRANSLATION_ENABLED = SUPABASE_SECRET_KEY ~= \"\" and SUPABASE_PUBLISHABLE_KEY ~= \"\" and SERVICE_ROLE_KEY_ASYMMETRIC\
              \ ~= \"\" and ANON_KEY_ASYMMETRIC ~= \"\"\n\nlocal PROTECTED_ROUTES = {\n  [\"auth-v1-protected\"] = true,\n\
              \  [\"rest-v1-openapi-protected\"] = true,\n  [\"rest-v1-protected\"] = true,\n  [\"graphql-v1-protected\"]\
              \ = true,\n  [\"realtime-v1-api-protected\"] = true,\n  [\"realtime-v1-ws-protected\"] = true,\n  [\"pg-protected\"\
              ] = true,\n}\n\nlocal function is_protected_route(route_name)\n  if route_name == nil or route_name == \"\"\
              \ then\n    return false\n  end\n\n  return PROTECTED_ROUTES[route_name] == true\nend\n\nlocal function is_valid_apikey(apikey)\n\
              \  if apikey == nil or apikey == \"\" then\n    return false\n  end\n\n  if SERVICE_ROLE_KEY ~= \"\" and apikey\
              \ == SERVICE_ROLE_KEY then\n    return true\n  end\n\n  if ANON_KEY ~= \"\" and apikey == ANON_KEY then\n  \
              \  return true\n  end\n\n  if TRANSLATION_ENABLED and apikey == SUPABASE_SECRET_KEY then\n    return true\n\
              \  end\n\n  if TRANSLATION_ENABLED and apikey == SUPABASE_PUBLISHABLE_KEY then\n    return true\n  end\n\n \
              \ return false\nend\n\nfunction envoy_on_request(request_handle)\n  local headers = request_handle:headers()\n\
              \  local route_name = request_handle:streamInfo():routeName()\n  if not is_protected_route(route_name) then\n\
              \    return\n  end\n\n  if is_valid_apikey(headers:get(\"apikey\")) then\n    return\n  end\n\n  request_handle:respond({\n\
              \    [\":status\"] = \"401\",\n    [\"content-type\"] = \"text/plain\",\n  }, \"Unauthorized\")\nend\n"
        - name: envoy.filters.http.lua
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inline_code: "local FUNCTIONS_ROUTE = \"functions-v1-all\"\nlocal FUNCTIONS_PREFIX = \"/functions/v1/\"\nlocal\
              \ SECRET_KEY = \"${SUPABASE_SECRET_KEY}\"\nlocal PUBLISHABLE_KEY = \"${SUPABASE_PUBLISHABLE_KEY}\"\nlocal SERVICE_ROLE_JWT\
              \ = \"${SERVICE_ROLE_KEY_ASYMMETRIC}\"\nlocal ANON_JWT = \"${ANON_KEY_ASYMMETRIC}\"\nlocal TRANSLATION_ENABLED\
              \ = SECRET_KEY ~= \"\" and PUBLISHABLE_KEY ~= \"\" and SERVICE_ROLE_JWT ~= \"\" and ANON_JWT ~= \"\"\n\nlocal\
              \ function is_functions_request(request_handle, headers)\n  if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE\
              \ then\n    return true\n  end\n\n  local path = headers:get(\":path\")\n  if path == nil then\n    return false\n\
              \  end\n\n  return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX\nend\n\nlocal function\
              \ translate_apikey(apikey)\n  if apikey == nil or apikey == \"\" then\n    return nil\n  end\n\n  if not TRANSLATION_ENABLED\
              \ then\n    return nil\n  end\n\n  if apikey == SECRET_KEY then\n    return SERVICE_ROLE_JWT\n  end\n\n  if\
              \ apikey == PUBLISHABLE_KEY then\n    return ANON_JWT\n  end\n\n  return nil\nend\n\nlocal function extract_query_apikey(path)\n\
              \  if path == nil or path == \"\" then\n    return nil\n  end\n\n  local query_start = string.find(path, \"\
              ?\", 1, true)\n  if query_start == nil then\n    return nil\n  end\n\n  local query = string.sub(path, query_start\
              \ + 1)\n  for key, value in string.gmatch(query, \"([^&]+)=([^&]*)\") do\n    if key == \"apikey\" and value\
              \ ~= \"\" then\n      return value\n    end\n  end\n\n  return nil\nend\n\nlocal function replace_query_apikey(path,\
              \ new_value)\n  if path == nil or path == \"\" or new_value == nil or new_value == \"\" then\n    return nil\n\
              \  end\n\n  local query_start = string.find(path, \"?\", 1, true)\n  if query_start == nil then\n    return\
              \ nil\n  end\n\n  local base = string.sub(path, 1, query_start)\n  local query = string.sub(path, query_start\
