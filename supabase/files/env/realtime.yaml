- name: PORT
  value: '4000'
- name: DB_HOST
  valueFrom:
    secretKeyRef:
      name: '{{ include "supabase.fullname" . }}-credentials'
      key: POSTGRES_HOST
- name: DB_PORT
  valueFrom:
    secretKeyRef:
      name: '{{ include "supabase.fullname" . }}-credentials'
      key: POSTGRES_PORT
- name: DB_USER
  value: supabase_admin
- name: DB_PASSWORD
  valueFrom:
    secretKeyRef:
      name: '{{ include "supabase.fullname" . }}-credentials'
      key: POSTGRES_PASSWORD
- name: DB_NAME
  valueFrom:
    secretKeyRef:
      name: '{{ include "supabase.fullname" . }}-credentials'
      key: POSTGRES_DB
- name: DB_AFTER_CONNECT_QUERY
  value: SET search_path TO _realtime
- name: DB_ENC_KEY
  valueFrom:
    secretKeyRef:
      name: '{{ include "supabase.fullname" . }}-credentials'
      key: REALTIME_DB_ENC_KEY
- name: API_JWT_SECRET
  valueFrom:
    secretKeyRef:
      name: '{{ include "supabase.fullname" . }}-credentials'
      key: JWT_SECRET
- name: SECRET_KEY_BASE
  valueFrom:
    secretKeyRef:
      name: '{{ include "supabase.fullname" . }}-credentials'
      key: SECRET_KEY_BASE
- name: METRICS_JWT_SECRET
  valueFrom:
    secretKeyRef:
      name: '{{ include "supabase.fullname" . }}-credentials'
      key: JWT_SECRET
- name: ERL_AFLAGS
  value: -proto_dist inet_tcp
- name: DNS_NODES
  value: ''''''
- name: RLIMIT_NOFILE
  value: '10000'
- name: APP_NAME
  value: realtime
- name: SEED_SELF_HOST
  value: 'true'
- name: RUN_JANITOR
  value: 'true'
- name: DISABLE_HEALTHCHECK_LOGGING
  value: 'true'
- name: API_JWT_JWKS
  valueFrom:
    secretKeyRef:
      name: '{{ include "supabase.fullname" . }}-credentials'
      key: JWT_JWKS
