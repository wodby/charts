apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distribution.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "distribution.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  minReadySeconds: {{ .Values.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "distribution.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      labels:
        {{- include "distribution.labels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- with (include "distribution.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "distribution.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.auth.htpasswd.enabled }}
      initContainers:
      - name: htpasswd
        image: {{ include "distribution.htpasswdImage" . }}
        imagePullPolicy: {{ .Values.auth.htpasswd.helperImage.pullPolicy }}
        command:
        - /bin/sh
        - -ec
        - htpasswd -Bbn "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" > /auth/htpasswd
        env:
        - name: REGISTRY_USERNAME
          value: {{ .Values.auth.htpasswd.username | quote }}
        - name: REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.existingEnvSecret | quote }}
              key: {{ .Values.auth.htpasswd.passwordKey | quote }}
        {{- if or .Values.persistence.enabled .Values.auth.htpasswd.enabled .Values.auth.token.rootCertBundle .Values.existingEnvSecret .Values.extraVolumeMounts }}
        volumeMounts:
        - name: htpasswd
          mountPath: /auth
      {{- end }}
      containers:
      - name: {{ .Values.containerName }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ include "distribution.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.envVars }}
        env:
          {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 10 }}
        {{- end }}
        ports:
          {{- toYaml .Values.containerPorts | nindent 10 }}
        {{- with .Values.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: /var/lib/registry
        {{- end }}
        {{- if .Values.auth.htpasswd.enabled }}
        - name: htpasswd
          mountPath: /auth
          readOnly: true
        {{- end }}
        {{- if .Values.auth.token.rootCertBundle }}
        - name: token-auth
          mountPath: /mnt/config/auth
          readOnly: true
        {{- end }}
        {{- if .Values.existingEnvSecret }}
        - name: env-secret
          mountPath: /mnt/config/env
          readOnly: true
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if or .Values.persistence.enabled .Values.auth.htpasswd.enabled .Values.auth.token.rootCertBundle .Values.existingEnvSecret .Values.extraVolumes }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "distribution.persistenceClaim" . }}
      {{- end }}
      {{- if .Values.auth.htpasswd.enabled }}
      - name: htpasswd
        emptyDir: {}
      {{- end }}
      {{- if .Values.auth.token.rootCertBundle }}
      - name: token-auth
        secret:
          secretName: {{ include "distribution.fullname" . }}-token-auth
      {{- end }}
      {{- if .Values.existingEnvSecret }}
      - name: env-secret
        secret:
          secretName: {{ .Values.existingEnvSecret | quote }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
