apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plane.fullname" . }}-files
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
data:
  Caddyfile: |
    {{- .Files.Get "files/Caddyfile" | nindent 4 }}
  init.sh: |
    {{- .Files.Get "files/init.sh" | nindent 4 }}
  check-admin.py: |
    {{- .Files.Get "files/check-admin.py" | nindent 4 }}
  setup.py: |
    {{- .Files.Get "files/setup.py" | nindent 4 }}
