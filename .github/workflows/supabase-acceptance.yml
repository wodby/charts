name: Supabase acceptance

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'stateful/**'
      - 'common/**'
      - 'scripts/supabase/**'
      - '.github/workflows/supabase-acceptance.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare local test dependencies
        run: |
          python -m pip install 'PyYAML==6.0.2' 'requests==2.32.5'
          helm dependency build stateful
          curl --fail --location --silent --show-error https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          chmod +x "$RUNNER_TEMP/kind"
          "$RUNNER_TEMP/kind" create cluster --name supabase-acceptance --kubeconfig "$RUNNER_TEMP/supabase-kubeconfig" --wait 120s
      - name: Exercise APIs, upgrades and coordinated recovery
        run: |
          python scripts/supabase/acceptance.py \
            --kubeconfig "$RUNNER_TEMP/supabase-kubeconfig" \
            --state "$RUNNER_TEMP/supabase-state" all
      - name: Remove the dedicated cluster
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/kind" ]; then
            "$RUNNER_TEMP/kind" delete cluster --name supabase-acceptance
          fi
