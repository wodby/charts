apiVersion: v1
kind: Service
metadata:
  name: {{ include "java.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "java.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  {{- if .Values.containerPorts.java }}
    - port: 8080
      targetPort: java
      protocol: TCP
      name: java
  {{- end }}
  {{- if .Values.containerPorts.sshd }}
    - port: 22
      targetPort: sshd
      protocol: TCP
      name: sshd
  {{- end }}
  selector:
    {{- include "java.selectorLabels" . | nindent 4 }}
