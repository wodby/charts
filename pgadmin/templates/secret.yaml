{{- if not .Values.admin.existingSecret -}}
{{- $password := .Values.admin.password -}}
{{- if not $password -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pgadmin.adminSecretName" .) -}}
{{- if and $existing (hasKey $existing.data .Values.admin.passwordKey) -}}
{{- $password = index $existing.data .Values.admin.passwordKey | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgadmin.adminSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgadmin.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.admin.passwordKey }}: {{ $password | quote }}
{{- end }}
