{{- if ne (empty .Values.server.passwordSecret) (empty .Values.server.passwordKey) -}}
{{- fail "server.passwordSecret and server.passwordKey must be configured together" -}}
{{- end -}}
{{- $serverPasswordEnabled := and .Values.server.enabled .Values.server.passwordSecret .Values.server.passwordKey -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgadmin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgadmin.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  minReadySeconds: {{ .Values.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pgadmin.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/server: {{ .Values.server | toJson | sha256sum }}
        checksum/admin-password: {{ .Values.admin.password | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pgadmin.labels" . | nindent 8 }}
        {{- with .Values.commonLabels }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- with (include "pgadmin.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "pgadmin.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if or $serverPasswordEnabled .Values.initContainers }}
      initContainers:
        {{- if $serverPasswordEnabled }}
        - name: pgpass
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "pgadmin.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /venv/bin/python3
            - -c
          args:
            - |
              import os
              from pathlib import Path

              def escape(value):
                  return value.replace("\\", "\\\\").replace(":", "\\:")

              fields = (
                  os.environ["PGPASS_HOST"],
                  os.environ["PGPASS_PORT"],
                  os.environ["PGPASS_DATABASE"],
                  os.environ["PGPASS_USERNAME"],
                  os.environ["PGPASS_PASSWORD"],
              )
              path = Path("/pgpass/pgpass")
              path.write_text(":".join(escape(value) for value in fields) + "\n")
              path.chmod(0o600)
          env:
            - name: PGPASS_HOST
              value: {{ .Values.server.host | quote }}
            - name: PGPASS_PORT
              value: {{ .Values.server.port | quote }}
            - name: PGPASS_DATABASE
              value: {{ .Values.server.maintenanceDatabase | quote }}
            - name: PGPASS_USERNAME
              value: {{ .Values.server.username | quote }}
            - name: PGPASS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.passwordSecret | quote }}
                  key: {{ .Values.server.passwordKey | quote }}
          volumeMounts:
            - name: pgpass
              mountPath: /pgpass
        {{- end }}
        {{- with .Values.initContainers }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.containerName | default .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "pgadmin.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: {{ .Values.admin.email | quote }}
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pgadmin.adminSecretName" . }}
                  key: {{ .Values.admin.passwordKey }}
            - name: PGADMIN_DISABLE_POSTFIX
              value: "true"
            - name: PGADMIN_LISTEN_PORT
              value: "8080"
            {{- if .Values.server.enabled }}
            - name: PGADMIN_SERVER_JSON_FILE
              value: /pgadmin4/servers.json
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: {{ .Values.server.replaceOnStartup | quote }}
            {{- if $serverPasswordEnabled }}
            - name: PGPASS_FILE
              value: /pgpass/pgpass
            {{- end }}
            {{- end }}
            {{- with .Values.envVars }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.containerPorts }}
          ports:
            {{- range . }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ default "TCP" .protocol }}
            {{- end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: tmp
              mountPath: /tmp
            {{- if .Values.server.enabled }}
            - name: servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            {{- end }}
            {{- if $serverPasswordEnabled }}
            - name: pgpass
              mountPath: /pgpass
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pgadmin.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.server.enabled }}
        - name: servers
          configMap:
            name: {{ include "pgadmin.fullname" . }}-servers
        {{- end }}
        {{- if $serverPasswordEnabled }}
        - name: pgpass
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
