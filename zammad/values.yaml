# Replicas of the NGINX, Rails and WebSocket components. The background worker
# always runs one replica, or none when this is 0.
replicaCount: 1
revisionHistoryLimit: 10

nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""
  imagePullSecrets: []

# One image runs every component.
image:
  registry: ghcr.io
  repository: zammad/zammad
  tag: "7.2.2-0035"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

commonLabels: {}
commonAnnotations: {}
podLabels: {}
podAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# Deployment policy shared by the components. Each component can override it
# with its own strategy, minReadySeconds, progressDeadlineSeconds and
# terminationGracePeriodSeconds.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
minReadySeconds: 10
progressDeadlineSeconds: 900
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 8080
  annotations: {}

nginx:
  # Scheme Zammad sees in X-Forwarded-Proto. Wodby routes terminate TLS.
  scheme: https
  clientMaxBodySize: 50M

init:
  # Runs Zammad's database install or migration before the background worker
  # starts. The other components wait until the database is current.
  enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

# Environment of every component, such as the database, Redis and Memcached
# settings. Wodby writes link, setting and integration variables only to the
# primary container's env, so the service maps that container's env here.
env: []

# Per-component settings. env entries replace the chart defaults and the shared
# env entries of the same name.
components:
  nginx:
    env: []
    strategy: {}
    minReadySeconds: null
    progressDeadlineSeconds: null
    terminationGracePeriodSeconds: null
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 256Mi
    podLabels: {}
    podAnnotations: {}
    extraVolumes: []
    extraVolumeMounts: []
    sidecars: []
  railsserver:
    env: []
    strategy: {}
    minReadySeconds: null
    progressDeadlineSeconds: null
    terminationGracePeriodSeconds: null
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        memory: 2Gi
    podLabels: {}
    podAnnotations: {}
    extraVolumes: []
    extraVolumeMounts: []
    sidecars: []
  websocket:
    env: []
    strategy: {}
    minReadySeconds: null
    progressDeadlineSeconds: null
    terminationGracePeriodSeconds: null
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi
    podLabels: {}
    podAnnotations: {}
    extraVolumes: []
    extraVolumeMounts: []
    sidecars: []
  scheduler:
    env: []
    # Recreated, so two background workers never run at once.
    strategy:
      type: Recreate
    minReadySeconds: null
    progressDeadlineSeconds: null
    terminationGracePeriodSeconds: null
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        memory: 2Gi
    podLabels: {}
    podAnnotations: {}
    extraVolumes: []
    extraVolumeMounts: []
    sidecars: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
