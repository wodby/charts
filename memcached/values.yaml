# Memcached nodes do not coordinate with each other. Keep this at one unless
# clients receive and consistently hash across an explicit server list.
replicaCount: 1
revisionHistoryLimit: 10

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

image:
  registry: docker.io
  repository: wodby/memcached
  pullPolicy: IfNotPresent
  tag: "1.6"
  digest: ""
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""
containerName: ""

commonLabels: {}
commonAnnotations: {}

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

containerPorts:
  - name: memcached
    containerPort: 11211
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  clusterIP: ""
  loadBalancerIP: ""
  externalTrafficPolicy: ""
  ports: []

resources: {}

envVars: []
envFrom: []
command: []
args:
  - -U
  - "0"

startupProbe:
  exec:
    command:
      - make
      - -f
      - /usr/local/bin/actions.mk
      - check-ready
      - max_try=1
  timeoutSeconds: 3
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  exec:
    command:
      - make
      - -f
      - /usr/local/bin/actions.mk
      - check-ready
      - max_try=1
  initialDelaySeconds: 10
  timeoutSeconds: 3
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  exec:
    command:
      - make
      - -f
      - /usr/local/bin/actions.mk
      - check-ready
      - max_try=1
  timeoutSeconds: 3
  periodSeconds: 5
  failureThreshold: 2

lifecycle: {}

# Recreate preserves the single-node cache contract during upgrades.
strategy:
  type: Recreate

initContainers: []
extraContainers: []

extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

terminationGracePeriodSeconds: 30

# Deployment availability and progress timing.
minReadySeconds: 10
progressDeadlineSeconds: 900
